<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuestionarios</title>
<meta name="theme-color" content="#1F5F8B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuestionarios">
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --text:#1B1F24; --muted:#5E6873; --line:#DDE1E6;
  --accent:#1F5F8B; --accent-soft:#E3EEF6;
  --ok:#1E7A46; --ok-soft:#E2F3E9; --ko:#B3261E; --ko-soft:#FBE7E5; --hint:#8A6100; --hint-soft:#FFF4D6;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121417; --card:#1C1F24; --text:#E8EAED; --muted:#9AA3AD; --line:#2E333A;
    --accent:#6FB1E0; --accent-soft:#1D2E3B;
    --ok:#5BC98A; --ok-soft:#16301F; --ko:#F2877E; --ko-soft:#3A1C1A; --hint:#E8C35A; --hint-soft:#33290F;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:680px; margin:0 auto; padding:16px 16px 40px}
header.top{display:flex; align-items:center; gap:10px; min-height:44px; margin-bottom:12px}
header.top h1{font-size:1.25rem; margin:0; flex:1; line-height:1.25}
#quiz header.top h1, #result header.top h1{font-size:1rem; font-weight:600; color:var(--muted)}
.iconbtn{
  border:0; background:transparent; color:var(--accent); font-size:1rem; font-weight:600;
  padding:10px 4px; cursor:pointer; min-height:44px;
}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
.list{display:grid; gap:12px}
.quiz-item{display:block; width:100%; text-align:left; cursor:pointer; color:inherit; font:inherit}
.quiz-item:active{transform:scale(.99)}
.quiz-item h2{font-size:1.05rem; margin:0 0 4px}
.quiz-item p{margin:0; color:var(--muted); font-size:.92rem}
.meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; font-size:.82rem; color:var(--muted)}
.pill{background:var(--accent-soft); color:var(--accent); border-radius:99px; padding:2px 10px; font-weight:600}
.pill.best{background:var(--ok-soft); color:var(--ok)}
.empty{color:var(--muted); text-align:center; padding:32px 8px}
#quizList{display:grid; gap:14px}
.modulo{border:1px solid var(--line); border-radius:14px; background:var(--card, #fff); overflow:hidden}
.modulo > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:14px 16px; -webkit-tap-highlight-color:transparent}
.modulo > summary::-webkit-details-marker{display:none}
.modulo > summary::after{content:''; margin-left:auto; width:9px; height:9px; border-right:2px solid var(--accent); border-bottom:2px solid var(--accent); transform:rotate(45deg); transition:transform .2s; flex:none}
.modulo[open] > summary::after{transform:rotate(-135deg)}
.modulo[open] > summary{border-bottom:2px solid var(--accent)}
.mod-title{font-size:1.1rem; margin:0; color:var(--accent)}
.mod-count{font-size:.8rem; color:var(--muted); font-weight:600}
.mod-body{padding:2px 14px 16px}
.ud-title{font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 8px}

.progress{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:6px}
.progress > div{height:100%; background:var(--accent); width:0; transition:width .25s}
.counter{display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); margin-bottom:14px}
.prompt{font-size:1.08rem; font-weight:600; margin:0 0 14px}
.options{display:grid; gap:10px}
.opt{
  display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left;
  background:var(--card); color:var(--text); border:1.5px solid var(--line); border-radius:12px;
  padding:13px 14px; font:inherit; cursor:pointer; min-height:52px;
}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  font-size:.8rem; font-weight:700; background:var(--accent-soft); color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:var(--ok-soft)}
.opt.correct .l{background:var(--ok); color:#fff}
.opt.wrong{border-color:var(--ko); background:var(--ko-soft)}
.opt.wrong .l{background:var(--ko); color:#fff}
.opt.dim{opacity:.55}
.hint{margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--hint-soft); color:var(--hint); font-size:.92rem}
.feedback{margin-top:14px; padding:12px 14px; border-radius:12px; border-left:4px solid; font-size:.95rem}
.feedback.ok{border-color:var(--ok); background:var(--ok-soft)}
.feedback.ko{border-color:var(--ko); background:var(--ko-soft)}
.feedback strong{display:block; margin-bottom:4px}
.actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
.btn{
  flex:1; min-height:48px; border-radius:12px; border:1.5px solid var(--accent);
  background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; padding:0 16px;
}
.btn.ghost{background:transparent; color:var(--accent)}
.btn:disabled{opacity:.4; cursor:default}
.score{font-size:3rem; font-weight:800; text-align:center; margin:8px 0 0; line-height:1.1}
.score-sub{text-align:center; color:var(--muted); margin:4px 0 16px}
.review h3{font-size:1rem; margin:20px 0 10px}
.review .item{padding:12px 0; border-top:1px solid var(--line)}
.review .item p{margin:4px 0}
.review .q{font-weight:600}
.review .yours{color:var(--ko)}
.review .right{color:var(--ok)}
.review .why{color:var(--muted); font-size:.92rem}
.settings{display:flex; align-items:center; gap:8px; margin:14px 0 4px; font-size:.92rem; color:var(--muted)}
.settings input{width:20px; height:20px; accent-color:var(--accent)}
.qnum{display:inline-block; font-size:.78rem; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:6px; padding:1px 7px; margin-right:6px; vertical-align:2px}
.markrow{display:flex; justify-content:flex-end; margin-top:12px}
.markbtn{border:1.5px dashed var(--line); background:transparent; color:var(--muted); border-radius:99px; padding:6px 14px; font:inherit; font-size:.88rem; font-weight:600; cursor:pointer; min-height:40px}
.markbtn.on{border-style:solid; border-color:var(--hint); background:var(--hint-soft); color:var(--hint)}
.marked{margin-top:20px}
.marked h3{font-size:1rem; margin:0 0 6px}
.marked .sub{color:var(--muted); font-size:.88rem; margin:0 0 10px}
.mlist{list-style:none; margin:0; padding:0}
.mlist li{display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); font-size:.92rem}
.mlist li span{flex:1}
.mlist .x{border:0; background:transparent; color:var(--muted); font-size:1.1rem; cursor:pointer; min-width:36px; min-height:36px}
.marked textarea{width:100%; min-height:64px; margin-top:10px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; font-size:.92rem; padding:8px 10px; resize:vertical}
.homemarks{margin-bottom:14px; border-color:var(--hint)}
.homemarks h2{font-size:1rem; margin:0 0 8px; color:var(--hint)}
.homemarks button.row{display:flex; justify-content:space-between; gap:10px; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:transparent; color:var(--text); font:inherit; padding:10px 0; cursor:pointer}
.homemarks button.row b{color:var(--hint); flex:none}
.sq{padding:14px 0; border-top:1px solid var(--line)}
.sq:first-child{border-top:0; padding-top:0}
.sq .q{font-weight:600; margin:0 0 8px}
.sq ol{margin:0; padding-left:22px; font-size:.94rem}
.sq li.ok{color:var(--ok); font-weight:600}
.sq .why{color:var(--muted); font-size:.9rem; margin:8px 0 0}
.note{background:var(--hint-soft); color:var(--hint); border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:.94rem; white-space:pre-wrap}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:.9rem; z-index:9; max-width:90vw; text-align:center}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <!-- Inicio -->
  <section id="home">
    <header class="top"><h1>Cuestionarios de clase</h1></header>
    <div id="homeMarks"></div>
    <div id="quizList" class="list"></div>
    <label class="settings"><input type="checkbox" id="shuffle" checked> Barajar preguntas y respuestas</label>
  </section>

  <!-- Pregunta -->
  <section id="quiz" class="hidden">
    <header class="top">
      <button class="iconbtn" id="exitBtn" aria-label="Salir">‹ Salir</button>
      <h1 id="quizTitle"></h1>
    </header>
    <div class="progress"><div id="bar"></div></div>
    <div class="counter"><span id="counter"></span><span id="liveScore"></span></div>
    <div class="card">
      <p class="prompt" id="prompt"></p>
      <div class="options" id="options"></div>
      <div id="hintBox" class="hint hidden"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="markrow"><button class="markbtn" id="markBtn" aria-pressed="false">☆ Llevar a clase</button></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="hintBtn">Pista</button>
      <button class="btn" id="nextBtn" disabled>Siguiente</button>
    </div>
  </section>

  <!-- Resultado -->
  <section id="result" class="hidden">
    <header class="top">
      <button class="iconbtn" id="homeBtn">‹ Inicio</button>
      <h1 id="resultTitle"></h1>
    </header>
    <div class="card">
      <p class="score" id="score"></p>
      <p class="score-sub" id="scoreSub"></p>
      <div class="actions">
        <button class="btn ghost" id="retryWrongBtn">Repetir falladas</button>
        <button class="btn" id="retryAllBtn">Repetir todo</button>
      </div>
      <div class="review" id="review"></div>
      <div id="resultMarks"></div>
    </div>
  </section>

  <!-- Lista de preguntas (compartida o propia) -->
  <section id="shared" class="hidden">
    <header class="top">
      <button class="iconbtn" id="sharedHomeBtn">‹ Inicio</button>
      <h1 id="sharedTitle"></h1>
    </header>
    <div class="card">
      <div id="sharedNote" class="note hidden"></div>
      <div id="sharedList"></div>
      <div class="actions">
        <button class="btn ghost" id="sharedSaveBtn">☆ Guardar en mis marcadas</button>
        <button class="btn" id="sharedPracticeBtn">Practicar estas</button>
      </div>
      <div id="sharedOwn"></div>
    </div>
  </section>

</div>
<div id="toast" class="toast hidden"></div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var LETTERS = 'ABCDEFGH';
  var STORE = 'cuestionarios_v1';

  function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ return {}; } }
  function save(d){ try { localStorage.setItem(STORE, JSON.stringify(d)); } catch(e){} }
  var store = load();

  var catalog = [], current = null, order = [], idx = 0, answers = [], answered = false;

  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function show(id){ ['home','quiz','result','shared'].forEach(function(s){ $(s).classList.toggle('hidden', s !== id); }); window.scrollTo(0,0); }

  // ---------- Carga de cuestionarios (con caché) ----------
  var cache = {};
  function entryOf(id){ return catalog.find(function(q){ return q.id === id; }); }
  function loadQuiz(id){
    if (cache[id]) return Promise.resolve(cache[id]);
    var entry = entryOf(id);
    if (!entry) return Promise.reject(new Error('no existe'));
    return fetch('../' + entry.archivo, {cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(d){
      d.id = id; cache[id] = d; return d;
    });
  }

  // ---------- Preguntas marcadas «para clase» ----------
  // Se guardan por cuestionario como posiciones originales (0, 1, 2…) en el JSON.
  function getMarks(id){ return ((store.marcadas || {})[id] || []).slice(); }
  function setMarks(id, list){
    store.marcadas = store.marcadas || {};
    list = list.filter(function(v,i,a){ return a.indexOf(v) === i; }).sort(function(a,b){ return a-b; });
    if (list.length) store.marcadas[id] = list; else delete store.marcadas[id];
    save(store);
  }
  function isMarked(id, i){ return getMarks(id).indexOf(i) !== -1; }
  function toggleMark(id, i){
    var m = getMarks(id), k = m.indexOf(i);
    if (k === -1) m.push(i); else m.splice(k, 1);
    setMarks(id, m);
  }
  // Número visible de la pregunta: el del examen original (campo "n") o su posición.
  function numOf(data, i){ var q = data.preguntas[i]; return q && q.n != null ? q.n : i + 1; }
  function indexOfNum(data, n){
    for (var i = 0; i < data.preguntas.length; i++) if (String(numOf(data, i)) === String(n)) return i;
    return -1;
  }
  function shareUrl(data, list, note){
    var url = location.origin + location.pathname + '?q=' + encodeURIComponent(data.id) +
      '&p=' + list.map(function(i){ return numOf(data, i); }).join(',');
    if (note) url += '&m=' + encodeURIComponent(note);
    return url;
  }
  function shareText(data, list, note){
    var lines = ['Preguntas que quiero ver en clase · ' + data.titulo];
    if (note) lines.push('', note);
    lines.push('');
    list.forEach(function(i){
      var t = data.preguntas[i].enunciado;
      lines.push('• P' + numOf(data, i) + ': ' + (t.length > 110 ? t.slice(0, 107) + '…' : t));
    });
    return lines.join('\n');
  }
  var toastT;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.add('hidden'); }, 2600);
  }
  function copy(text){
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta); return Promise.resolve();
  }
  function doShare(data, list, note){
    var url = shareUrl(data, list, note), text = shareText(data, list, note);
    if (navigator.share){
      navigator.share({ title: 'Preguntas para clase', text: text, url: url }).catch(function(){});
    } else {
      copy(text + '\n\n' + url).then(function(){ toast('Copiado: pégalo en WhatsApp, Classroom o un correo'); });
    }
  }

  // Panel con la lista marcada de un cuestionario: quitar, añadir comentario, compartir.
  function marksPanel(data){
    var list = getMarks(data.id);
    if (!list.length) return '';
    return '<div class="marked" data-id="'+esc(data.id)+'"><h3>☆ Para llevar a clase ('+list.length+')</h3>' +
      '<p class="sub">Comparte la lista con el profe o con la clase. El enlace abre exactamente estas preguntas.</p>' +
      '<ul class="mlist">' + list.map(function(i){
        return '<li><span><b>P'+esc(numOf(data, i))+'</b> · '+esc(data.preguntas[i].enunciado)+'</span>' +
          '<button class="x" data-i="'+i+'" aria-label="Quitar">×</button></li>';
      }).join('') + '</ul>' +
      '<textarea placeholder="Comentario opcional: qué no entiendes o qué concepto quieres que se explique"></textarea>' +
      '<div class="actions"><button class="btn ghost" data-act="view">Ver lista</button>' +
      '<button class="btn" data-act="share">Compartir</button></div></div>';
  }
  function bindPanel(box, data, rerender){
    box.onclick = function(e){
      var x = e.target.closest('.x');
      var note = (box.querySelector('textarea') || {}).value || '';
      if (x){ toggleMark(data.id, +x.getAttribute('data-i')); rerender(); return; }
      var b = e.target.closest('[data-act]'); if (!b) return;
      var list = getMarks(data.id);
      if (b.getAttribute('data-act') === 'share') doShare(data, list, note.trim());
      else openShared(data.id, list, note.trim(), true);
    };
  }

  // ---------- Inicio ----------
  function quizCard(q){
    var best = store.best && store.best[q.id];
    return '<button class="card quiz-item" data-id="'+esc(q.id)+'">' +
      '<h2>'+esc(q.titulo)+'</h2>' +
      (q.descripcion ? '<p>'+esc(q.descripcion)+'</p>' : '') +
      '<div class="meta">' +
        (q.asignatura ? '<span class="pill">'+esc(q.asignatura)+'</span>' : '') +
        (q.preguntas ? '<span>'+q.preguntas+' preguntas</span>' : '') +
        (best != null ? '<span class="pill best">Mejor: '+best+'%</span>' : '') +
      '</div></button>';
  }

  // Agrupa por módulo y, dentro, por unidad, respetando el orden de index.json
  function renderHome(){
    var modulos = [], byMod = {};
    catalog.forEach(function(q){
      var m = q.modulo || 'Otros', u = q.unidad || '';
      if (!byMod[m]){ byMod[m] = {unidades:[], byUd:{}}; modulos.push(m); }
      var g = byMod[m];
      if (!g.byUd[u]){ g.byUd[u] = []; g.unidades.push(u); }
      g.byUd[u].push(q);
    });
    var html = modulos.map(function(m){
      var g = byMod[m];
      var n = g.unidades.reduce(function(a,u){ return a + g.byUd[u].length; }, 0);
      var open = (store.abiertos || {})[m] ? ' open' : '';
      return '<details class="modulo" data-mod="'+esc(m)+'"'+open+'><summary><h2 class="mod-title">'+esc(m)+'</h2>' +
        '<span class="mod-count">'+n+' cuestionario'+(n===1?'':'s')+'</span></summary><div class="mod-body">' +
        g.unidades.map(function(u){
          return (u ? '<h3 class="ud-title">'+esc(u.replace(/_/g,' '))+'</h3>' : '') +
            '<div class="list">' + g.byUd[u].map(quizCard).join('') + '</div>';
        }).join('') + '</div></details>';
    }).join('');
    $('quizList').innerHTML = html || '<p class="empty">Aún no hay cuestionarios.</p>';
    var mk = Object.keys(store.marcadas || {}).filter(function(id){ return entryOf(id); });
    $('homeMarks').innerHTML = mk.length ? '<div class="card homemarks"><h2>☆ Mis preguntas para clase</h2>' +
      mk.map(function(id){
        var n = store.marcadas[id].length;
        return '<button class="row" data-id="'+esc(id)+'"><span>'+esc(entryOf(id).titulo)+'</span><b>'+n+'</b></button>';
      }).join('') + '</div>' : '';
    Array.prototype.forEach.call($('quizList').querySelectorAll('details.modulo'), function(d){
      d.addEventListener('toggle', function(){
        store.abiertos = store.abiertos || {};
        if (d.open) store.abiertos[d.getAttribute('data-mod')] = 1; else delete store.abiertos[d.getAttribute('data-mod')];
        save(store);
      });
    });
    show('home');
  }

  $('quizList').addEventListener('click', function(e){
    var el = e.target.closest('.quiz-item'); if (!el) return;
    openQuiz(el.getAttribute('data-id'));
  });
  $('shuffle').checked = store.shuffle !== false;
  $('shuffle').addEventListener('change', function(){ store.shuffle = this.checked; save(store); });

  $('homeMarks').addEventListener('click', function(e){
    var el = e.target.closest('.row'); if (!el) return;
    var id = el.getAttribute('data-id');
    openShared(id, getMarks(id), '', true);
  });

  function openQuiz(id){
    loadQuiz(id).then(function(data){
      current = data;
      history.replaceState(null, '', '?q=' + encodeURIComponent(id));
      start(data.preguntas.map(function(_,i){ return i; }));
    }).catch(function(){ alert('No se pudo cargar el cuestionario.'); });
  }

  // ---------- Lista de preguntas (enlace compartido o lista propia) ----------
  var sharedCtx = null;
  function openShared(id, list, note, own){
    loadQuiz(id).then(function(data){
      list = list.filter(function(i){ return i >= 0 && i < data.preguntas.length; });
      sharedCtx = { data: data, list: list, own: own };
      $('sharedTitle').textContent = (own ? 'Mis preguntas · ' : 'Preguntas compartidas · ') + data.titulo;
      $('sharedNote').classList.toggle('hidden', !note);
      $('sharedNote').textContent = note || '';
      $('sharedList').innerHTML = list.length ? list.map(function(i){
        var q = data.preguntas[i];
        return '<div class="sq"><p class="q"><span class="qnum">P'+esc(numOf(data, i))+'</span>'+esc(q.enunciado)+'</p><ol type="A">' +
          q.opciones.map(function(o, k){ return '<li'+(k === q.correcta ? ' class="ok"' : '')+'>'+esc(o)+(k === q.correcta ? ' ✓' : '')+'</li>'; }).join('') +
          '</ol>' + (q.explicacion ? '<p class="why">'+esc(q.explicacion)+'</p>' : '') + '</div>';
      }).join('') : '<p class="empty">No hay preguntas en esta lista.</p>';
      $('sharedSaveBtn').classList.toggle('hidden', own || !list.length);
      $('sharedPracticeBtn').disabled = !list.length;
      var box = $('sharedOwn');
      if (own){
        var rer = function(){ openShared(id, getMarks(id), '', true); };
        box.innerHTML = marksPanel(data);
        var ta = box.querySelector('textarea'); if (ta && note) ta.value = note;
        var v = box.querySelector('[data-act="view"]'); if (v) v.classList.add('hidden');
        bindPanel(box, data, rer);
      } else box.innerHTML = '';
      history.replaceState(null, '', shareUrl(data, list, note).replace(location.origin + location.pathname, ''));
      show('shared');
    }).catch(function(){ alert('No se pudo cargar el cuestionario.'); });
  }
  $('sharedHomeBtn').addEventListener('click', goHome);
  $('sharedPracticeBtn').addEventListener('click', function(){
    if (!sharedCtx) return; current = sharedCtx.data; start(sharedCtx.list.slice());
  });
  $('sharedSaveBtn').addEventListener('click', function(){
    if (!sharedCtx) return;
    setMarks(sharedCtx.data.id, getMarks(sharedCtx.data.id).concat(sharedCtx.list));
    toast('Guardadas en «Mis preguntas para clase»');
    this.classList.add('hidden');
  });

  // ---------- Pregunta ----------
  function start(indices){
    order = $('shuffle').checked ? shuffle(indices) : indices;
    idx = 0; answers = [];
    $('quizTitle').textContent = current.titulo;
    show('quiz'); renderQuestion();
  }

  function renderQuestion(){
    var q = current.preguntas[order[idx]];
    answered = false;
    var opts = q.opciones.map(function(o,i){ return {texto:o, i:i}; });
    if ($('shuffle').checked) opts = shuffle(opts);
    q._shown = opts;
    $('bar').style.width = (idx / order.length * 100) + '%';
    $('counter').textContent = 'Pregunta ' + (idx+1) + ' de ' + order.length;
    var ok = answers.filter(function(a){ return a.ok; }).length;
    $('liveScore').textContent = idx ? ok + ' / ' + idx + ' bien' : '';
    $('prompt').innerHTML = (q.n != null ? '<span class="qnum">P'+esc(q.n)+'</span>' : '') + esc(q.enunciado);
    paintMark();
    $('options').innerHTML = opts.map(function(o,k){
      return '<button class="opt" data-k="'+k+'"><span class="l">'+LETTERS[k]+'</span><span>'+esc(o.texto)+'</span></button>';
    }).join('');
    $('hintBox').classList.add('hidden');
    $('hintBox').textContent = q.pista || '';
    $('hintBtn').classList.toggle('hidden', !q.pista);
    $('hintBtn').disabled = false;
    $('feedback').className = 'feedback hidden';
    $('nextBtn').disabled = true;
    $('nextBtn').textContent = idx === order.length - 1 ? 'Ver resultado' : 'Siguiente';
  }

  $('options').addEventListener('click', function(e){
    var el = e.target.closest('.opt'); if (!el || answered) return;
    answered = true;
    var q = current.preguntas[order[idx]];
    var chosen = q._shown[+el.getAttribute('data-k')];
    var ok = chosen.i === q.correcta;
    answers.push({ q: order[idx], elegida: chosen.i, ok: ok });
    Array.prototype.forEach.call($('options').children, function(b, k){
      var o = q._shown[k];
      b.disabled = true;
      if (o.i === q.correcta) b.classList.add('correct');
      else if (b === el) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    var fb = $('feedback');
    fb.className = 'feedback ' + (ok ? 'ok' : 'ko');
    fb.innerHTML = '<strong>' + (ok ? '¡Correcto!' : 'No es correcta') + '</strong>' + esc(q.explicacion || '');
    $('hintBtn').disabled = true;
    $('nextBtn').disabled = false;
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
  });

  function paintMark(){
    var on = isMarked(current.id, order[idx]);
    $('markBtn').classList.toggle('on', on);
    $('markBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('markBtn').textContent = on ? '★ Para clase' : '☆ Llevar a clase';
  }
  $('markBtn').addEventListener('click', function(){
    toggleMark(current.id, order[idx]); paintMark();
    toast(isMarked(current.id, order[idx]) ? 'Marcada para preguntar en clase' : 'Quitada de la lista');
  });

  $('hintBtn').addEventListener('click', function(){ $('hintBox').classList.remove('hidden'); this.disabled = true; });
  $('nextBtn').addEventListener('click', function(){
    if (idx < order.length - 1){ idx++; renderQuestion(); window.scrollTo(0,0); } else finish();
  });
  $('exitBtn').addEventListener('click', function(){
    if (answers.length && !confirm('¿Salir del cuestionario? Se perderá el progreso.')) return;
    goHome();
  });

  // ---------- Resultado ----------
  function finish(){
    var ok = answers.filter(function(a){ return a.ok; }).length;
    var pct = Math.round(ok / answers.length * 100);
    if (answers.length === current.preguntas.length){
      store.best = store.best || {};
      if (store.best[current.id] == null || pct > store.best[current.id]) store.best[current.id] = pct;
      save(store);
    }
    $('resultTitle').textContent = current.titulo;
    $('score').textContent = pct + '%';
    $('scoreSub').textContent = ok + ' de ' + answers.length + ' correctas';
    var wrong = answers.filter(function(a){ return !a.ok; });
    $('retryWrongBtn').classList.toggle('hidden', !wrong.length);
    $('review').innerHTML = wrong.length ? '<h3>Repasa las falladas</h3>' + wrong.map(function(a){
      var q = current.preguntas[a.q];
      return '<div class="item"><p class="q">'+esc(q.enunciado)+'</p>' +
        '<p class="yours">✗ '+esc(q.opciones[a.elegida])+'</p>' +
        '<p class="right">✓ '+esc(q.opciones[q.correcta])+'</p>' +
        (q.explicacion ? '<p class="why">'+esc(q.explicacion)+'</p>' : '') + '</div>';
    }).join('') : '<h3>¡Pleno! Ninguna fallada.</h3>';
    renderResultMarks();
    show('result');
  }
  function renderResultMarks(){
    var box = $('resultMarks');
    box.innerHTML = marksPanel(current);
    bindPanel(box, current, renderResultMarks);
  }

  $('retryWrongBtn').addEventListener('click', function(){
    start(answers.filter(function(a){ return !a.ok; }).map(function(a){ return a.q; }));
  });
  $('retryAllBtn').addEventListener('click', function(){
    start(current.preguntas.map(function(_,i){ return i; }));
  });
  $('homeBtn').addEventListener('click', goHome);

  function goHome(){ history.replaceState(null, '', location.pathname); renderHome(); }

  // ---------- Arranque ----------
  fetch('index.json', {cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(list){
    catalog = list;
    var sp = new URLSearchParams(location.search);
    var q = sp.get('q'), p = sp.get('p');
    if (q && entryOf(q)) {
      renderHome();
      if (p) loadQuiz(q).then(function(data){
        var list = p.split(',').map(function(n){ return indexOfNum(data, n.trim()); }).filter(function(i){ return i !== -1; });
        openShared(q, list, sp.get('m') || '', false);
      });
      else openQuiz(q);
    }
    else renderHome();
  }).catch(function(){
    $('quizList').innerHTML = '<p class="empty">No se pudo cargar la lista de cuestionarios.</p>';
  });
})();
</script>
</body>
</html>
